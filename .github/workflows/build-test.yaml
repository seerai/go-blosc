name: Build Test

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
  pull_request:
    branches: [main]
    paths-ignore:
      - README.md

jobs:
  Build-Test:
    runs-on: ubuntu-latest
    container: golang:alpine3.20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup blosc library
        run: |
          apk add blosc blosc-dev build-base
      - name: Run Tests
        run: |
          CGO_ENABLED=1 go test ./... -coverprofile=coverage.out -covermode=atomic
      - name: Upload Coverage
        uses: codecov/codecov-action@v2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          files: ./coverage.out

      - name: Calc Semver
        id: semver
        uses: paulhatch/semantic-version@v5.3.0
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR)"
          minor_pattern: "(MINOR)"
          version_format: "${major}.${minor}.${patch}"
          search_commit_body: true
      - uses: mshick/add-pr-comment@v1
        with:
          message: |
            Next Version to be Released: ${{ steps.semver.outputs.version_tag }}
          repo-token: ${{ secrets.HEADLESS_USER_PAT }}
          repo-token-user-login: "seerai-headless"
          allow-repeats: false
